<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Screener</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><path d='M5 24l7-8 5 5 10-12' stroke='%23ffa028' stroke-width='3' fill='none'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/terminal.css">
</head>
<body>
<header class="topbar">
  <a class="logo" href="#/PICKS" aria-label="Screener home">SCREENER</a>
  <form id="cmdForm" class="cmd" role="search" autocomplete="off">
    <span class="prompt" aria-hidden="true">&gt;</span>
    <input id="cmd" spellcheck="false" autocapitalize="characters" placeholder="Search a stock — e.g. TCS, Reliance, HDFC Bank" aria-label="Command line" role="combobox" aria-controls="suggest" aria-expanded="false" aria-autocomplete="list">
    <button class="go" type="submit">GO</button>
    <div id="suggest" class="suggest hidden" role="listbox"></div>
  </form>
  <button id="viewToggle" class="btn vt" type="button" title="Switch between the simple layout and the full terminal"></button>
  <div class="clockbox"><span id="mkt" class="mkt"></span><span id="clock" class="clock"></span></div>
</header>
<div id="tape" class="tape" aria-label="Market ticker"></div>
<nav id="fkeys" class="fkeys" aria-label="Functions"></nav>
<div class="crumbbar"><span id="crumb"></span></div>
<main id="view"></main>
<footer class="status">
  <span id="feed" class="feed">● CONNECTING…</span>
  <span class="muted">Yahoo Finance · Google News · delayed data · not investment advice</span>
</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
